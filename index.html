    <meta name="description" content="Rushi (如實, ‘as it really is’): eight Chinese characters — 道 無 為 愛 不 二 量 司 — mapped as stars along a Lorenz attractor. Every line between them says what kind of claim it is." />

    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <meta property="og:title" content="如實 Rushi — Eight Characters as a Navigable Cosmos" />
    <meta property="og:description" content="Eight Chinese characters set as stars along a strange attractor. Every line is a claim, and every claim says what kind of claim it is." />
    <meta property="og:image" content="https://maitrism.com/og.png" />
    <meta property="og:url" content="https://maitrism.com/" />

    <style>
      html, body { margin: 0; height: 100%; background: #05060B; }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: grid; place-items: center;
        background: #05060B; color: #EAF2FF; transition: opacity .7s ease;
        font: 400 13px/1.4 ui-sans-serif, system-ui, sans-serif;
      }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot .g { font: 400 44px/1 "Noto Serif TC", "Songti TC", serif; color: #F5E3C3; letter-spacing: .08em;
        animation: breathe 2.4s ease-in-out infinite; text-align: center; }
      #boot p { margin: 14px 0 0; color: #64748b; letter-spacing: .14em; text-transform: uppercase; font-size: 10.5px; text-align: center; }
      @keyframes breathe { 50% { opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { #boot .g { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite"><div><div class="g">如實</div><p>Gathering starlight</p></div></div>
    <noscript>
      <p style="color:#EAF2FF;font-family:serif;text-align:center;padding:2rem">Rushi needs JavaScript to draw its galaxy.</p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
